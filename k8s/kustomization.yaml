# Kustomize entrypoint: kubectl apply -k k8s/
# (or: kustomize build k8s/ | kubectl apply -f -)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml

# namespace applied to every resource (all already declare it; this makes it
# explicit for resources that forget it)
namespace: inventory-api

commonLabels:
  app: inventory-api
