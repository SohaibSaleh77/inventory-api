# =============================================================================
# EXAMPLE PLACEHOLDER SECRETS - do NOT put real values here and do NOT commit
# real secrets to git. In production, create this Secret out-of-band instead:
#
#   kubectl -n inventory-api create secret generic inventory-api-secrets \
#     --from-literal=IMS_DB_USERNAME=ims_app \
#     --from-literal=IMS_DB_PASSWORD='<real password>' \
#     --from-literal=IMS_BOOTSTRAP_ADMIN_PASSWORD='<real password>'
#
# or manage it with sealed-secrets / external-secrets / SOPS / a vault injector.
# This file exists so `kubectl apply -k k8s/` works for local/demo clusters.
#
# Notes:
# - IMS_BOOTSTRAP_ADMIN_PASSWORD is only read on the very first boot (when the
#   users table is empty); rotate the admin password right after login.
# - The app role needs SELECT/INSERT/UPDATE/DELETE/EXECUTE only; schema
#   migrations run out-of-band with a DDL-privileged role (com.inventory-api.tools.Migrate).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: inventory-api-secrets
  namespace: inventory-api
  labels:
    app: inventory-api
type: Opaque
stringData:
  IMS_DB_USERNAME: "ims_app"
  IMS_DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  IMS_BOOTSTRAP_ADMIN_PASSWORD: "CHANGE_ME_ROTATE_AFTER_FIRST_LOGIN"
