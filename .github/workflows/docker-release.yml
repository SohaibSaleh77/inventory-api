# Release pipeline (tag-triggered, e.g. v1.1.0):
#   1. mvn -DskipTests package      (CI already verified the commit)
#   2. build + push the OCI image to ghcr.io/<owner>/<repo>
#   3. attach the runtime jar + dependency libs as a release artifact
name: Docker Release

on:
  push:
    tags: ['v*']

# Least privilege by default; the release job widens 'contents' to write
# the GitHub release.
permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub release + upload assets
      packages: write   # push the image to ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21 (Temurin) with Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build (tests already ran in CI)
        run: mvn -B -DskipTests package

      - name: Bundle runtime artifacts (inventory-api.jar + lib/)
        run: |
          cd target
          zip -r "inventory-api-${GITHUB_REF_NAME}.zip" inventory-api.jar lib/
          sha256sum "inventory-api-${GITHUB_REF_NAME}.zip" > "inventory-api-${GITHUB_REF_NAME}.zip.sha256"

      - name: Resolve image name and version tag
        id: image
        run: |
          # ghcr.io requires lowercase repository names
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          echo "name=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attach jar + libs to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/inventory-api-${{ github.ref_name }}.zip
            target/inventory-api-${{ github.ref_name }}.zip.sha256
