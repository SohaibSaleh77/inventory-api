# =============================================================
# Inventory Management System - default configuration
# Override precedence (highest first):
#   1. JVM system properties (-Dkey=value)
#   2. Environment variables (IMS_ prefixed, e.g. IMS_HTTP_PORT)
#   3. External file ./config/application.properties
#   4. This file (classpath defaults)
#
# NOTE: no secrets live in this file. Supply db.password,
# IMS_BOOTSTRAP_ADMIN_PASSWORD and everything environment-specific
# through IMS_* environment variables (see docs/DEPLOYMENT.md).
# =============================================================

# --- HTTP server ---
http.host=127.0.0.1
http.port=8080

# Hard cap on request body size (bytes). Larger bodies are rejected
# with 413 before being buffered - protects the heap from hostile or
# accidental oversized payloads.
http.maxRequestBodyBytes=1048576

# --- Rate limiting (per client IP, in-memory, per process) ---
# Login gets a separate, much tighter bucket. Set enabled=false for
# local development or when an upstream gateway already throttles.
http.rateLimit.enabled=true
http.rateLimit.requestsPerSecond=50
http.rateLimit.burst=100
http.rateLimit.loginRequestsPerMinute=10
# Trust X-Forwarded-For / X-Real-IP (ONLY enable behind a trusted
# reverse proxy that overwrites the header, never directly exposed).
http.trustProxyHeaders=false

# --- CORS (browser access; empty = disabled, no CORS headers sent) ---
# Comma-separated list of allowed origins, e.g. https://ims.example.com
http.cors.allowedOrigins=

# --- Metrics endpoint (GET /api/metrics, Prometheus text format) ---
http.metrics.enabled=true

# --- Database (production: supply via environment variables) ---
db.url=jdbc:mysql://127.0.0.1:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=LOCAL
db.username=ims_app
db.password=
db.pool.maxSize=20
db.pool.minIdle=4
db.pool.connectionTimeoutMs=8000
db.pool.idleTimeoutMs=300000
db.pool.maxLifetimeMs=1500000
db.pool.leakDetectionThresholdMs=15000
# Automatic retries for MySQL deadlocks (SQLState 40001) at the
# transaction boundary. The victim transaction is rolled back entirely,
# so re-running the closure is safe. 0 disables retrying.
db.retry.deadlockMaxRetries=2

# --- Security ---
security.token.ttlMinutes=240
security.password.iterations=210000
security.password.saltBytes=16
security.login.maxFailedAttempts=5
security.login.lockoutMinutes=15

# --- API behaviour ---
# Idempotency-Key support for POST/PUT/PATCH/DELETE requests.
app.idempotency.enabled=true
app.idempotency.ttlHours=24

# --- Lifecycle ---
# Seconds the HTTP server waits for in-flight requests to complete
# after SIGTERM before forcibly closing connections.
app.shutdownDrainSeconds=10

# --- Housekeeping (background scheduler) ---
# Purges expired/revoked API tokens and stale idempotency records.
app.housekeeping.enabled=true
app.housekeeping.intervalMinutes=60

# --- Webhooks (outbound event notifications) ---
# Business events are appended to a delivery outbox inside the same
# transaction as the change; a background dispatcher POSTs them with
# HMAC-SHA256 signatures and exponential backoff (1m doubling, 6h cap).
app.webhooks.enabled=true
app.webhooks.dispatchIntervalSeconds=30
app.webhooks.timeoutSeconds=10
app.webhooks.maxAttempts=6

# --- Application ---
app.name=inventory-api
# The app user (ims_app) has DML-only grants by design; run schema migrations
# with com.ims.tools.Migrate using a DDL-privileged role instead.
app.migrateOnStartup=false
